<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perseverance Calc</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="calculator" aria-label="Scientific calculator">

    <h1 class="brand">Scientific Calculator</h1>

    <section class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <output class="result" id="result">0</output>

    </section>

    <div class="modes" role="group" aria-label="Angle mode">
      <button type="button" data-mode="deg" class="active">DEG</button>
      <button type="button" data-mode="rad">RAD</button>
      <button type="button" data-mode="grad">GRAD</button>
      <button type="button" id="shift" aria-pressed="false">SHIFT</button>
    </div>

    <div class="keys" id="keys">

      
      <button type="button" class="fn" data-fn="sin" data-alt="asin">sin</button>
      <button type="button" class="fn" data-fn="cos" data-alt="acos">cos</button>
      <button type="button" class="fn" data-fn="tan" data-alt="atan">tan</button>
      <button type="button" class="fn" data-fn="sqrt" data-alt="cbrt" aria-label="Square root">√</button>

      <button type="button" class="fn" data-fn="log">log</button>
      <button type="button" class="fn" data-fn="ln">ln</button>
      <button type="button" class="fn" data-insert="²" aria-label="Square">x²</button>
      <button type="button" class="fn" data-insert="^" aria-label="Power">xʸ</button>

      
      <button type="button" class="fn" data-insert="π" aria-label="Pi">π</button>
      <button type="button" class="fn" data-insert="e" aria-label="Euler's number">e</button>
      <button type="button" class="fn" data-insert="(" aria-label="Open bracket">(</button>
      <button type="button" class="fn" data-insert=")" aria-label="Close bracket">)</button>

      
      <button type="button" class="clear" data-action="clear" aria-label="Clear all">C</button>
      <button type="button" class="clear" data-action="back" aria-label="Backspace">del</button>
      <button type="button" class="op" data-insert="%" aria-label="Percent">%</button>
      <button type="button" class="op" data-insert="÷" aria-label="Divide">÷</button>

      
      <button type="button" data-insert="7">7</button>
      <button type="button" data-insert="8">8</button>
      <button type="button" data-insert="9">9</button>
      <button type="button" class="op" data-insert="×" aria-label="Multiply">×</button>

      <button type="button" data-insert="4">4</button>
      <button type="button" data-insert="5">5</button>
      <button type="button" data-insert="6">6</button>
      <button type="button" class="op" data-insert="−" aria-label="Subtract">−</button>

      <button type="button" data-insert="1">1</button>
      <button type="button" data-insert="2">2</button>
      <button type="button" data-insert="3">3</button>
      <button type="button" class="op" data-insert="+" aria-label="Add">+</button>

      <button type="button" data-insert="0">0</button>
      <button type="button" data-insert="." aria-label="Decimal point">.</button>
      <button type="button" data-action="ans">Ans</button>
      <button type="button" class="eq" data-action="equals" aria-label="Equals">=</button>

    </div>
  </main>

</body>
</html>
